# The sky. Hand-maintained; change by PR.
#
# chapters: one asterism per chapter of the landing-page essay, in the order they are read. The
# essay is the subject and the sky is its backdrop: the chapter in view is lit, the rest fall back,
# and a faint line of travel runs from each figure's first star to the next chapter's.
#
# A figure is authored, not generated. Stars are [x, y] in constellation-local units about the
# chapter's `at` (x right, y up; the whole sky spans x ±1.4, y ±1.05), and `lines` are index pairs
# into that list — the shape is the point, and a seeded layout would only make noise. Depth comes
# from a stable hash per star, so the figures stand in the arm rather than printing over it.
#
# waypoints: galaxy-scale positions of the places, units ≈ kpc, disc in the XZ plane (radius ~15),
# core at the origin. documentation is the core; the others sit ~120° apart and the spiral arms are
# bent through them.

chapters:
  # A dock and a pitched roof.
  - id: warehouse
    name: The warehouse
    at: [-1.3, -0.85]
    stars: [[0, 0], [0.46, 0], [0.46, 0.27], [0.23, 0.46], [0, 0.27], [0.23, 0.12]]
    lines: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 0], [0, 5], [5, 1]]

  # A column: two feet, a shaft, a capital.
  - id: philosophy
    name: Philosophy
    at: [-1.0, 0.24]
    stars: [[0, 0], [0.32, 0], [0.07, 0.14], [0.25, 0.14], [0.07, 0.5], [0.25, 0.5], [0, 0.64], [0.32, 0.64]]
    lines: [[0, 1], [0, 2], [1, 3], [2, 3], [2, 4], [3, 5], [4, 5], [4, 6], [5, 7], [6, 7]]

  # A paw: four toes over a pad.
  - id: vet-med
    name: Veterinary medicine
    at: [0.42, 0.36]
    stars: [[0, 0.34], [0.17, 0.46], [0.36, 0.44], [0.51, 0.3], [0.25, 0]]
    lines: [[0, 4], [1, 4], [2, 4], [3, 4], [0, 1], [1, 2], [2, 3]]

  # A die on its point, pipped through the middle.
  - id: casino-it
    name: Casino IT
    at: [0.8, -0.8]
    stars: [[0.26, 0], [0.52, 0.28], [0.26, 0.56], [0, 0.28], [0.26, 0.28], [0.13, 0.42], [0.39, 0.14]]
    lines: [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [4, 6]]

waypoints:
  - { id: constellation, pos: [6.93, 0, 4] }
  - { id: incidents, pos: [-9.53, 0, 5.5] }
  - { id: gitops, pos: [0, 0, -5.5] }
  - { id: documentation, pos: [0, 0, 0] }
  - { id: resume, pos: [5.5, 0, -8.5] }
