# THALES as the constellation. Hand-maintained; change by PR.
#
# Disclosure boundary (spec §4): hostnames, roles, logical links and product names only.
# The schema in src/content.config.ts has no field for addresses, VLAN IDs, ports or
# versions, and rejects role text that looks like one.
#
# layer: physical | proxmox | kubernetes | services
# pos (optional star override): constellation-local, x ±1.4, y ±1.05 (physical low, services
# high), z toward the viewer.
# waypoints: galaxy-scale positions of the places, units ≈ kpc, disc in the XZ plane (radius
# ~15), core at the origin. documentation is the core; the others sit ~120° apart and the
# spiral arms are bent through them.

nodes:
  # physical
  - { id: leonidas, role: Gateway and firewall, layer: physical }
  - { id: bias, role: Core switch, layer: physical }
  - { id: thales-01, role: Proxmox node, layer: physical }
  - { id: thales-02, role: Proxmox node, layer: physical }
  - { id: thales-03, role: Proxmox node, layer: physical }
  - { id: solon, role: NAS, layer: physical }

  # proxmox guests
  - { id: timaeus, role: Domain controller, layer: proxmox }
  - { id: simmias, role: Domain controller, layer: proxmox }
  - { id: gorgias, role: Certificate authority, layer: proxmox }
  - { id: cratylus-01, role: DNS resolver, layer: proxmox }
  - { id: cratylus-02, role: DNS resolver, layer: proxmox }
  - { id: cratylus-03, role: DNS resolver, layer: proxmox }
  - { id: hippodamus, role: Management host, layer: proxmox }
  - { id: hippias, role: Subnet router, layer: proxmox }
  - { id: zeno, role: Container registry, layer: proxmox }
  - { id: pittacus, role: Backup server, layer: proxmox }
  - { id: chilon, role: Syslog, layer: proxmox }
  - { id: aristophanes, role: Media server, layer: proxmox }
  - { id: odysseus, role: AI workspace, layer: proxmox }

  # kubernetes
  - { id: anaximander-cp1, role: Control plane, layer: kubernetes }
  - { id: anaximander-cp2, role: Control plane, layer: kubernetes }
  - { id: anaximander-cp3, role: Control plane, layer: kubernetes }
  - { id: anaximander-w1, role: Worker, layer: kubernetes }
  - { id: anaximander-w2, role: Worker, layer: kubernetes }
  - { id: anaximander-w3, role: Worker, layer: kubernetes }
  - { id: anaximander-w4, role: Worker, layer: kubernetes }

  # services
  - { id: flux, role: GitOps, layer: services }
  - { id: jenkins, role: CI, layer: services }
  - { id: flagger, role: Progressive delivery, layer: services }
  - { id: authentik, role: SSO, layer: services }
  - { id: vault, role: Secrets, layer: services }
  - { id: prometheus, role: Metrics, layer: services }
  - { id: loki, role: Logs, layer: services }
  - { id: grafana, role: Dashboards, layer: services }
  - { id: ceph, role: Block storage, layer: services }

