# Hashed assets are immutable; everything else (the HTML) is revalidated on every load. Without an
# explicit header a browser caches the HTML heuristically and can show an old page after a deploy.
# One server-level add_header rather than one per location: a location's own add_header drops every
# header inherited from the server, which cost /_astro/ its nosniff and CSP.
map $uri $cache_control {
    ~^/_astro/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Relative Location on directory redirects: nginx would otherwise add its listen
    # port (:8080), which only exists inside the pod, and /tokens would hang.
    absolute_redirect off;

    # The 3D chunk's budget (spec §5) is gzipped; without this it ships at ~4x.
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header Cache-Control $cache_control always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_astro/ {
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
